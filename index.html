<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@17.0.2/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      const root = document.getElementById("root");
      function MinstoHours() {
        const [menu, setMenu] = React.useState(0);
        const [amount, setAmount] = React.useState(0);
        const [flipped, setFlipped] = React.useState(false);
        const onChange = (event) => {
          setAmount(event.target.value);
        };
        function reset() {
          setAmount(0);
        }
        const onFlip = () => {
          reset();
          setFlipped((current) => !current);
        };
        return (
          <div>
            <div>
              <label htmlFor="minutes">Minutes</label>
              <input
                value={flipped ? amount * 60 : amount}
                id="minutes"
                placeholder="Minutes"
                type="number"
                onChange={onChange}
                disabled={flipped}
              />
            </div>
            <div>
              <label htmlFor="hours">Hours</label>
              <input
                value={flipped ? amount : Math.round(amount / 60)}
                id="hours"
                placeholder="hours"
                type="number"
                disabled={!flipped}
                onChange={onChange}
              />
            </div>
            <button onClick={reset}>reset</button>
            <button onClick={onFlip}>flip</button>
          </div>
        );
      }
      function KmtoMiles() {
        const [menu, setMenu] = React.useState(0);
        const [amount, setAmount] = React.useState(0);
        const [flipped, setFlipped] = React.useState(false);
        const onChange = (event) => {
          setAmount(event.target.value);
        };
        function reset() {
          setAmount(0);
        }
        const onFlip = () => {
          reset();
          setFlipped((current) => !current);
        };
        return (
          <div>
            <div>
              <label htmlFor="killometers">Killometers</label>
              <input
                value={
                  flipped ? Math.round(amount * 1.60934 * 100) / 100 : amount
                }
                id="killometers"
                placeholder="killometers"
                type="number"
                onChange={onChange}
                disabled={flipped}
              />
            </div>
            <div>
              <label htmlFor="miles">Miles</label>
              <input
                value={
                  flipped ? amount : Math.round(amount * 0.621371 * 100) / 100
                }
                id="miles"
                placeholder="miles"
                type="number"
                disabled={!flipped}
                onChange={onChange}
              />
            </div>
            <button onClick={reset}>reset</button>
            <button onClick={onFlip}>flip</button>
          </div>
        );
      }

      function App() {
        const [menu, setMenu] = React.useState("0");
        const [amount, setAmount] = React.useState(0);
        const [flipped, setFlipped] = React.useState(false);
        const onChange = (event) => {
          setAmount(event.target.value);
        };
        function reset() {
          setAmount(0);
        }
        const onFlip = () => {
          reset();
          setFlipped((current) => !current);
        };
        const onSelect = (event) => {
          setMenu(event.target.value);
        };
        return (
          <div>
            <h1>간이 단위 변환기d</h1>
            <select value={menu} onChange={onSelect}>
              <option value="0">Minutes & Hours</option>
              <option value="1">Km & Miles</option>
            </select>
            {menu === "0" ? <MinstoHours /> : <KmtoMiles />}
          </div>
        );
      }

      ReactDOM.render(<App />, root);

      //ReactDOM.render(div,root);
    </script>
  </body>
</html>
